http {
    # Создаются две зоны лимита
    limit_req_zone $binary_remote_addr zone=rl_web:10m    rate=50r/s;   # 50r/s для веба
    limit_req_zone $binary_remote_addr zone=rl_mobile:10m rate=30r/s;  # 30r/s для моб

    server {
        listen 80;

        location /api/ {
            # Проверяется заголовок $http_client_type
            if ($http_client_type = "web") {
                # Применяется лимит для веба
                limit_req zone=rl_web burst=100;
            }
            if ($http_client_type = "mobile") {
                # Применяется лимит для моб
                limit_req zone=rl_mobile burst=100;
            }

            proxy_pass http://backend;
        }
    }
}